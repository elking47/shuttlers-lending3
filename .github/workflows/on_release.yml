name: Generate Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - version-16

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "Shuttlers Finance"
          GIT_AUTHOR_EMAIL: "finance@shuttlers.co"
          GIT_COMMITTER_NAME: "Shuttlers Finance"
          GIT_COMMITTER_EMAIL: "finance@shuttlers.co"
        run: npx semantic-release
